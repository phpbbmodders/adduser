name: Tests

# For most extensions, this workflow should not need changing;
# simply commit it to your repository.
#
# See the README for full details and configuration instructions:
#  - https://github.com/phpbb-extensions/test-framework
#
on:
  push:
    # Run tests when commits are pushed to these branches
    branches:
      - master

  pull_request:
    # Run tests when pull requests are made on these branches
    branches:
      - master

jobs:
  call-tests:
    name: Extension tests
    uses: phpbb-extensions/test-framework/.github/workflows/tests.yml@3.3.x
    with:
      EXTNAME: phpbbmodders/adduser

      # OPTIONAL CONFIGURATIONS BELOW
      # The following arguments are optional and can be omitted if not needed.

      # The phpBB repository's branch to use when running tests.
      # Default is '3.3.x', which this framework is designed for.
      # If using a different branch, ensure it's compatible with 3.3.x.
      # To test with phpBB's master branch, refer to the phpBB Branches section of this README.
      # Default: '3.3.x'
      PHPBB_BRANCH: '3.3.x'

      # Run phpBB's EPV (Extension Pre Validator) here? The epv job below runs it instead.
      EPV: 0

      # Check for files with executable permissions?
      EXECUTABLE_FILES: 1

      # Remove embedded ICC profiles from images?
      IMAGE_ICC: 1

      # Run CodeSniffer to detect PHP code style issues?
      SNIFF: 1

      # Run MySQL/MariaDB tests?
      RUN_MYSQL_JOBS: 0

      # Run PostgreSQL tests?
      RUN_PGSQL_JOBS: 0

      # Run MSSQL and SQLite3 tests?
      RUN_MSSQL_JOBS: 0

      # Run Windows IIS & PostgreSQL tests?
      RUN_WINDOWS_JOBS: 0

      # Run functional tests if you have them?
      RUN_FUNCTIONAL_TESTS: 0

      # Install npm dependencies (if your extension relies on them)?
      RUN_NPM_INSTALL: 0

      # Install Composer dependencies (if your extension relies on them)?
      RUN_COMPOSER_INSTALL: 0

      # CUSTOMISE PHP VERSIONS
      # To override the default PHP versions tested (7.2 through 8.4):

      # Preferred PHP version used for all test jobs.
      PRIMARY_PHP_VERSION: '8.0'

      # The MySQL and PostgreSQL jobs run tests across multiple PHP versions.
      # List the PHP versions you want your extension tested with.
      PHP_VERSION_MATRIX: '["8.0", "8.1", "8.2", "8.3", "8.4"]'

      # Generate a code coverage report (see documentation below)?
      CODECOV: 0

  # EPV (Extension Pre Validator), failing on any Fatal or Error finding not
  # listed in .github/epv-allowed.txt
  epv:
    uses: phpbbmodders/.github/.github/workflows/epv.yml@v1
    with:
      EXTNAME: phpbbmodders/adduser
